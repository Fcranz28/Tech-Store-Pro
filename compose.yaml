services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: techstore_pro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - techstore_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d techstore_pro"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  techstore_pgdata:
