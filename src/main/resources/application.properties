spring.application.name=TechStore-Pro
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=techstore-pro
app.jwt.expiration-minutes=60
app.frontend-origin=${APP_FRONTEND_ORIGIN:http://localhost:4200}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.upload-dir=${UPLOAD_DIR:./uploads/productos}
app.public-url=${APP_PUBLIC_URL:http://localhost:8080}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
